<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cognitive Performance Challenge</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Progress bar (hidden on home/details) -->
        <div id="progress-bar" class="progress-bar hidden">
            <div class="progress-step" data-station="reaction">
                <span class="progress-icon">1</span>
                <span class="progress-label">Reaction</span>
            </div>
            <div class="progress-step" data-station="memory">
                <span class="progress-icon">2</span>
                <span class="progress-label">Memory</span>
            </div>
            <div class="progress-step" data-station="calculation">
                <span class="progress-icon">3</span>
                <span class="progress-label">Calculation</span>
            </div>
            <div class="progress-step" data-station="visuospatial">
                <span class="progress-icon">4</span>
                <span class="progress-label">Visuospatial</span>
            </div>
        </div>

        <!-- Main content area -->
        <div id="screen-container"></div>
    </div>

    <script src="config.js"></script>
    <script src="stations.js"></script>
    <script src="results.js"></script>
    <script src="app.js"></script>
</body>
</html>
